# The checks placed in front of the commit. Replaces pre-commit, which
# required Python and uv in an otherwise 100% TypeScript repository.
#
# Installation takes care of itself: package.json's `prepare` script runs
# `lefthook install` on every `pnpm install`. Previously nothing guaranteed
# a clone had its hooks in place.
#
# To run everything without committing: `pnpm hooks`.

pre-commit:
  parallel: true
  jobs:
    - name: hygiene
      # Trailing whitespace, final newline, CRLF, conflict markers, large
      # files, case collisions, valid YAML and JSON.
      run: node scripts/hooks/hygiene.mjs {staged_files}

    - name: secrets
      # The guard rail that counts, and it counts more since the repository
      # went public: a key pushed to a public repository is compromised
      # immediately and irreversibly, forks and GitHub caches keeping it
      # despite any history rewrite.
      run: pnpm exec secretlint --maskSecrets {staged_files}

    - name: biome
      glob: "*.{js,mjs,cjs,ts,mts,cts,vue,css,json,jsonc}"
      exclude:
        - "app/assets/css/*.css"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: typecheck
      # The equivalent of `mypy --strict`. Unlike Biome, it reads the
      # templates: it is what sees a badly typed component. It works on the
      # whole project, not on the staged files.
      glob: "*.{ts,vue}"
      exclude:
        - "frontend/**"
      run: pnpm typecheck

    - name: v-html
      glob: "*.vue"
      run: scripts/hooks/check-v-html.sh

    - name: templates
      # The blind spot between the two tools above: Biome reads the
      # `<script>` of a .vue WITHOUT the `<template>`, and typecheck treats
      # neither an unknown auto-imported component nor an undeclared
      # attribute as an error. Both shipped to production on 15/09/2026 as
      # fallout from the French→English rename — a dead « Décliner » panel,
      # and a CV PDF that could never be selected.
      #
      # On the whole tree and not on the staged files: knowing whether
      # <Foo> exists means knowing every component, not just the ones about
      # to be committed.
      glob: "*.vue"
      run: node scripts/hooks/vue-templates.mjs

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
