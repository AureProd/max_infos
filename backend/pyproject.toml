[project]
name = "unmaxdinfo"
version = "0.1.0"
description = "API et rendu du site unmaxdinfo.fr"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "authlib>=1.4",
    "itsdangerous>=2.2",
    "cryptography>=44.0",
    "boto3>=1.36",
    "markdown-it-py>=3.0",
    "bleach>=6.2",
    "python-slugify>=8.0",
    "pillow>=11.1",
    "feedgen>=1.0",
    "apscheduler>=3.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "factory-boy>=3.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.1",
    "pip-audit>=2.8",
    "types-bleach",
    "boto3-stubs[s3]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S", "C4", "DTZ", "PTH", "T20"]
ignore = [
    "B008",   # Depends() en valeur par défaut : l'idiome de FastAPI
    "RUF001", # les apostrophes typographiques françaises dans les chaînes
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]   # assert et identifiants factices
"migrations/*" = ["E501", "N999", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["feedgen.*", "apscheduler.*", "factory.*", "slugify.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
markers = ["integration: nécessite la base de données"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py", "migrations/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
