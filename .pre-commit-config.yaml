# Installation : uv tool install pre-commit && pre-commit install --install-hooks -t pre-commit -t commit-msg
#
# Pourquoi pre-commit et non lefthook, dans un dépôt désormais 100 % TypeScript :
# le hook qui compte le plus ici est detect-secrets, avec une baseline auditée,
# et il est écrit en Python. Changer d'ordonnanceur pour retirer Python tout en
# gardant un hook Python n'enlèverait rien et perdrait cet acquis.
# À réexaminer si un jour le secret scanning natif de GitHub (gratuit et actif
# sur les dépôts publics, avec push protection) remplace detect-secrets : alors
# lefthook devient le bon choix et la bascule prend une heure.
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  # --- Hygiène générale ---------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # La typographie française des articles ne doit pas être retouchée.
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: ^(\.vscode/|.*\.jsonc$)
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]

  # --- Aucun secret en clair ----------------------------------------------
  # Le garde-fou qui compte, et il compte davantage depuis que le dépôt est
  # public : une clé poussée sur un dépôt public est compromise immédiatement
  # et irréversiblement, les forks et les caches GitHub la conservant malgré
  # toute réécriture d'historique.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(pnpm-lock\.yaml|drizzle/.*\.sql|scripts/seed/content/.*|frontend/.*)$

  # --- TypeScript ---------------------------------------------------------
  - repo: local
    hooks:
      - id: biome
        name: biome (lint + format)
        entry: pnpm exec biome check --write --no-errors-on-unmatched
        language: system
        files: \.(js|mjs|cjs|ts|mts|cts|vue|css|json|jsonc)$
        exclude: ^(frontend/|app/assets/css/base\.css$)

      - id: typecheck
        name: typage (vue-tsc, strict)
        # L'équivalent de `mypy --strict` du lot 1. Contrairement à Biome, il
        # lit les templates : c'est lui qui voit un composant mal typé.
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        files: \.(ts|vue)$
        exclude: ^frontend/

      - id: no-new-v-html
        name: aucun v-html non autorisé
        entry: scripts/hooks/check-v-html.sh
        language: system
        pass_filenames: false
        files: \.vue$

  # --- Message de commit ---------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
