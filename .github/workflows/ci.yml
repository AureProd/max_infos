name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Dépôt public : moindre privilège par défaut, relevé tâche par tâche si besoin.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Qualité (lint, typage, hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint et format
        run: pnpm exec biome ci .
      - name: Typage
        run: pnpm typecheck
      - name: Aucun secret en clair
        run: pnpm secrets
      - name: Hygiène des fichiers
        run: node scripts/hooks/hygiene.mjs $(git ls-files)
      - name: Aucun v-html non autorisé
        run: scripts/hooks/check-v-html.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Un seul projet, une seule installation, une couverture consolidée :
    # mieux que les deux seuils de 80 % séparés de l'ancienne CI.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unmaxdinfo_test
          POSTGRES_USER: unmaxdinfo
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U unmaxdinfo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NUXT_PUBLIC_APP_ENV: dev
      DATABASE_URL: postgres://unmaxdinfo:test@localhost:5432/unmaxdinfo_test
      NUXT_DATABASE_URL: postgres://unmaxdinfo:test@localhost:5432/unmaxdinfo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Appliquer les migrations
        run: pnpm db:migrate

      - name: Aucune migration manquante
        # L'équivalent d'`alembic --autogenerate --check` du lot 1 : si le
        # schéma TypeScript a changé sans qu'on génère la migration, un
        # fichier apparaît ici et la tâche échoue.
        run: |
          pnpm db:check
          pnpm db:generate --name controle_de_derive
          git diff --exit-code drizzle/ \
            || { echo "::error::Une migration manque. Lancer 'pnpm db:generate' et commiter le fichier SQL."; exit 1; }

      - name: Tests et couverture
        run: pnpm coverage

      - name: Récapitulatif de couverture
        if: always()
        run: |
          echo '### Couverture' >> "$GITHUB_STEP_SUMMARY"
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            const l = ['lines','statements','functions','branches'];
            console.log('| Métrique | % |'); console.log('|---|---|');
            for (const k of l) console.log(\`| \${k} | \${s[k].pct} |\`);
          " >> "$GITHUB_STEP_SUMMARY" || true

  security:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level=high
      - name: osv-scanner
        # Interroge la base OSV, dont la couverture diffère de celle du
        # registre npm : garder les deux n'est pas redondant.
        run: pnpm dlx osv-scanner@latest scan source --lockfile=pnpm-lock.yaml

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    # Sur un dépôt public, les workflows sont une surface d'attaque à part
    # entière : injection par titre de PR, actions non épinglées, secrets
    # exposés à une PR extérieure.
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  build:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          push: false
          load: true
          tags: unmaxdinfo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: unmaxdinfo:ci
          # L'image GHCR devient publique : un secret qui s'y glisserait
          # serait lisible par tout le monde.
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
