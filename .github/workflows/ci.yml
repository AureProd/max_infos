name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Public repository: least privilege by default, raised job by job if needed.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Quality (lint, types, hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm exec biome ci .
      - name: Types
        run: pnpm typecheck
      - name: No secret in the clear
        run: pnpm secrets
      - name: File hygiene
        run: node scripts/hooks/hygiene.mjs $(git ls-files)
      - name: No unauthorized v-html
        run: scripts/hooks/check-v-html.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    # One project, one install, one consolidated coverage: better than the
    # two separate 80% thresholds of the old CI.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unmaxdinfo_test
          POSTGRES_USER: unmaxdinfo
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U unmaxdinfo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NUXT_PUBLIC_APP_ENV: dev
      DATABASE_URL: postgres://unmaxdinfo:test@localhost:5432/unmaxdinfo_test
      NUXT_DATABASE_URL: postgres://unmaxdinfo:test@localhost:5432/unmaxdinfo_test
      # The only one vitest actually reads: its `api` project OVERRIDES
      # NUXT_DATABASE_URL, and test/setup/db.ts otherwise falls back to the
      # db-test of the development compose (port 15000), absent from the runner.
      TEST_DATABASE_URL: postgres://unmaxdinfo:test@localhost:5432/unmaxdinfo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply the migrations
        run: pnpm db:migrate

      - name: No missing migration
        # The equivalent of lot 1's `alembic --autogenerate --check`: if the
        # TypeScript schema changed without the migration being generated, a
        # file appears here and the job fails.
        run: |
          pnpm db:check
          pnpm db:generate --name controle_de_derive
          git diff --exit-code drizzle/ \
            || { echo "::error::Une migration manque. Lancer 'pnpm db:generate' et commiter le fichier SQL."; exit 1; }

      - name: Tests and coverage
        run: pnpm coverage

      - name: Coverage summary
        if: always()
        run: |
          echo '### Couverture' >> "$GITHUB_STEP_SUMMARY"
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            const l = ['lines','statements','functions','branches'];
            console.log('| Metric | % |'); console.log('|---|---|');
            for (const k of l) console.log(\`| \${k} | \${s[k].pct} |\`);
          " >> "$GITHUB_STEP_SUMMARY" || true

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level=high
      - name: osv-scanner
        # Queries the OSV database, whose coverage differs from the npm
        # registry's: keeping both is not redundant.
        #
        # osv-scanner is NOT an npm package -- the registry answers 404. It is
        # a Go binary, delivered here by its official action's OCI image.
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            scan
            source
            --lockfile=pnpm-lock.yaml

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    # On a public repository, workflows are an attack surface of their own:
    # injection through a PR title, unpinned actions, secrets exposed to an
    # outside PR.
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  build:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (without publishing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          push: false
          load: true
          tags: unmaxdinfo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: unmaxdinfo:ci
          # The GHCR image becomes public: a secret slipping into it would
          # be readable by everyone.
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
