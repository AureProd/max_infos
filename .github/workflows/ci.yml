name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.2"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Qualité (lint, typage, hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pre-commit en différentiel a besoin de l'historique
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --project backend
      - run: npm ci --prefix frontend
      - name: pre-commit (différentiel sur la PR, complet sur main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run --project backend pre-commit run \
              --from-ref origin/${{ github.base_ref }} --to-ref HEAD --show-diff-on-failure
          else
            uv run --project backend pre-commit run --all-files --show-diff-on-failure
          fi
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend mypy app
        working-directory: backend

  test-backend:
    name: Tests back
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unmaxdinfo_test
          POSTGRES_USER: unmaxdinfo
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U unmaxdinfo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: dev
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: unmaxdinfo_test
      POSTGRES_USER: unmaxdinfo
      POSTGRES_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
        working-directory: backend
      - name: Récapitulatif de couverture
        if: always()
        run: |
          echo '### Couverture back' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
        working-directory: backend

  test-frontend:
    name: Tests front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  security:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - name: pip-audit
        run: uv run pip-audit --strict
        working-directory: backend
        continue-on-error: false
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  build:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [quality, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/deploy/Dockerfile
          push: false
          load: true
          tags: unmaxdinfo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: unmaxdinfo:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
