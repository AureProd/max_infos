name: Deployment

on:
  push:
    branches: [main]
    # A tag deploys too: it allows replaying a precise version.
    tags: ["v*"]
  workflow_dispatch:

# The deployment is CONDITIONAL on CI passing: without that, a commit
# breaking the tests would go to production all the same.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "22"

jobs:
  attendre-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          running-workflow-name: Wait for CI
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

  publier:
    name: Build and publish the images
    runs-on: ubuntu-latest
    needs: [attendre-ci]
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      # The lowered name travels to the deployment job: recomputing it there
      # would be a second chance to get it wrong.
      repository: ${{ steps.meta.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        # A Docker repository name MUST be lowercase, whereas a GitHub owner
        # keeps the case it was created with: `AureProd/max_infos` is a valid
        # repository and an invalid tag. Lowered ONCE here, then reused, so
        # the two images and the deployment cannot drift apart.
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "tags=${REGISTRY}/${repository}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repository }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repository }}-migrate:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repository }}-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployer:
    name: Deploy to the VPS
    runs-on: ubuntu-latest
    needs: [publier]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Render the production .env
        # The server now holds nothing but the SSH key: everything else is
        # built here, on every deployment, from the secrets and variables of
        # the `production` environment.
        #
        # The values travel through the step's environment, never the
        # command line: `ps` would show it to every process on the runner.
        #
        # And the file itself is NEVER WRITTEN ON THE RUNNER. It travels as a
        # single base64 line and is rebuilt on the server, under `umask 077`.
        # Copying it would have meant opening it to every user first — the
        # copy action runs in a container under another identity, and `tar`
        # answered « Permission denied » on a 0600 file. base64 also settles
        # the quoting question for good: its alphabet holds no quote, no
        # space and no `$`, so no password can break out of the transport.
        env:
          # --- What Compose interpolates, on the server -------------------
          APP_IMAGE: ${{ env.REGISTRY }}/${{ needs.publier.outputs.repository }}:${{ github.sha }}
          MIGRATE_IMAGE: ${{ env.REGISTRY }}/${{ needs.publier.outputs.repository }}-migrate:${{ github.sha }}
          INSTANCE_NAME: unmaxdinfo
          # --- Secrets ---------------------------------------------------
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NUXT_SECRET_ENCRYPTION_KEY: ${{ secrets.NUXT_SECRET_ENCRYPTION_KEY }}
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.NUXT_OAUTH_GOOGLE_CLIENT_SECRET }}
          NUXT_R2_ACCOUNT_ID: ${{ secrets.NUXT_R2_ACCOUNT_ID }}
          NUXT_R2_ACCESS_KEY_ID: ${{ secrets.NUXT_R2_ACCESS_KEY_ID }}
          NUXT_R2_SECRET_ACCESS_KEY: ${{ secrets.NUXT_R2_SECRET_ACCESS_KEY }}
          NUXT_INSTAGRAM_APP_SECRET: ${{ secrets.NUXT_INSTAGRAM_APP_SECRET }}
          # --- Réglages, lus des DEUX côtés -------------------------------
          #
          # `vars.X || secrets.X`. Ces valeurs n'ont rien de confidentiel — un
          # identifiant client, un nom de bucket, une adresse de redirection —
          # et leur place est dans Variables. Mais rien n'empêche de les saisir
          # dans Secrets, et `vars.` renvoie alors une chaîne vide.
          #
          # Les deux sont donc acceptés, et ce n'est pas du confort : celles
          # qui ont une valeur par défaut basculeraient dessus SANS RIEN DIRE.
          # Un déploiement réussi en apparence, sur le mauvais hôte ou avec
          # l'ordonnanceur qu'on croyait avoir coupé.
          URL_HOST: ${{ vars.URL_HOST || secrets.URL_HOST || 'unmaxdinfo.fr' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || secrets.POSTGRES_DB || 'unmaxdinfo' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || secrets.POSTGRES_USER || 'unmaxdinfo' }}
          DB_HOST: ${{ vars.DB_HOST || secrets.DB_HOST || 'db' }}
          DB_PORT: ${{ vars.DB_PORT || secrets.DB_PORT || '5432' }}
          NUXT_OAUTH_GOOGLE_CLIENT_ID: ${{ vars.NUXT_OAUTH_GOOGLE_CLIENT_ID || secrets.NUXT_OAUTH_GOOGLE_CLIENT_ID }}
          NUXT_OAUTH_GOOGLE_REDIRECT_URL: ${{ vars.NUXT_OAUTH_GOOGLE_REDIRECT_URL || secrets.NUXT_OAUTH_GOOGLE_REDIRECT_URL }}
          NUXT_BOOTSTRAP_TECH_EMAIL: ${{ vars.NUXT_BOOTSTRAP_TECH_EMAIL || secrets.NUXT_BOOTSTRAP_TECH_EMAIL }}
          NUXT_R2_BUCKET: ${{ vars.NUXT_R2_BUCKET || secrets.NUXT_R2_BUCKET }}
          NUXT_R2_ENDPOINT: ${{ vars.NUXT_R2_ENDPOINT || secrets.NUXT_R2_ENDPOINT }}
          NUXT_INSTAGRAM_APP_ID: ${{ vars.NUXT_INSTAGRAM_APP_ID || secrets.NUXT_INSTAGRAM_APP_ID }}
          NUXT_INSTAGRAM_SYNC_INTERVAL_MINUTES: ${{ vars.NUXT_INSTAGRAM_SYNC_INTERVAL_MINUTES || secrets.NUXT_INSTAGRAM_SYNC_INTERVAL_MINUTES || '60' }}
          NUXT_SCHEDULER_ENABLED: ${{ vars.NUXT_SCHEDULER_ENABLED || secrets.NUXT_SCHEDULER_ENABLED || 'true' }}
          NUXT_PUBLIC_R2_BASE_URL: ${{ vars.NUXT_PUBLIC_R2_BASE_URL || secrets.NUXT_PUBLIC_R2_BASE_URL }}
        run: |
          set -euo pipefail
          umask 077

          # Completeness check BEFORE writing anything: a deployment refused
          # here beats an `app` container restarting in a loop on the server.
          missing=()
          for nom in POSTGRES_PASSWORD NUXT_SECRET_ENCRYPTION_KEY \
                     NUXT_SESSION_PASSWORD NUXT_OAUTH_GOOGLE_CLIENT_ID \
                     NUXT_OAUTH_GOOGLE_CLIENT_SECRET NUXT_OAUTH_GOOGLE_REDIRECT_URL \
                     NUXT_BOOTSTRAP_TECH_EMAIL NUXT_R2_ACCOUNT_ID \
                     NUXT_R2_ACCESS_KEY_ID NUXT_R2_SECRET_ACCESS_KEY \
                     NUXT_R2_BUCKET NUXT_R2_ENDPOINT NUXT_PUBLIC_R2_BASE_URL; do
            [ -n "${!nom:-}" ] || missing+=("$nom")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Values missing from the 'production' environment: ${missing[*]}"
            exit 1
          fi

          # Composed, never stored twice: a URL and a password that drift
          # apart make a failure whose cause does not show.
          database_url="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}"

          content=$(
            echo "# Built by GitHub Actions, overwritten on every deployment."
            echo "# Do not edit here: the source of truth is"
            echo "# Settings -> Secrets and variables -> Actions -> production."
            echo "APP_ENV=prod"
            echo "URL_HOST=${URL_HOST}"
            echo "URL_SCHEME=https"
            echo "POSTGRES_DB=${POSTGRES_DB}"
            echo "POSTGRES_USER=${POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "DB_HOST=${DB_HOST}"
            echo "DB_PORT=${DB_PORT}"
            echo "DATABASE_URL=${database_url}"
            echo "NUXT_DATABASE_URL=${database_url}"
            echo "NUXT_SECRET_ENCRYPTION_KEY=${NUXT_SECRET_ENCRYPTION_KEY}"
            echo "NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD}"
            echo "NUXT_OAUTH_GOOGLE_CLIENT_ID=${NUXT_OAUTH_GOOGLE_CLIENT_ID}"
            echo "NUXT_OAUTH_GOOGLE_CLIENT_SECRET=${NUXT_OAUTH_GOOGLE_CLIENT_SECRET}"
            echo "NUXT_OAUTH_GOOGLE_REDIRECT_URL=${NUXT_OAUTH_GOOGLE_REDIRECT_URL}"
            echo "NUXT_BOOTSTRAP_TECH_EMAIL=${NUXT_BOOTSTRAP_TECH_EMAIL}"
            echo "NUXT_R2_ACCOUNT_ID=${NUXT_R2_ACCOUNT_ID}"
            echo "NUXT_R2_ACCESS_KEY_ID=${NUXT_R2_ACCESS_KEY_ID}"
            echo "NUXT_R2_SECRET_ACCESS_KEY=${NUXT_R2_SECRET_ACCESS_KEY}"
            echo "NUXT_R2_BUCKET=${NUXT_R2_BUCKET}"
            echo "NUXT_R2_ENDPOINT=${NUXT_R2_ENDPOINT}"
            echo "NUXT_INSTAGRAM_APP_ID=${NUXT_INSTAGRAM_APP_ID}"
            echo "NUXT_INSTAGRAM_APP_SECRET=${NUXT_INSTAGRAM_APP_SECRET}"
            echo "NUXT_INSTAGRAM_SYNC_INTERVAL_MINUTES=${NUXT_INSTAGRAM_SYNC_INTERVAL_MINUTES}"
            echo "NUXT_SCHEDULER_ENABLED=${NUXT_SCHEDULER_ENABLED}"
            echo "NUXT_PUBLIC_APP_ENV=prod"
            echo "NUXT_PUBLIC_BASE_URL=https://${URL_HOST}"
            echo "NUXT_PUBLIC_R2_BASE_URL=${NUXT_PUBLIC_R2_BASE_URL}"
            echo ""
            echo "# What Compose interpolates. They live here so that a plain"
            echo "# \`docker compose -f docker-compose.yml -f docker-compose-prod-override.yml logs\`"
            echo "# works on the server, without having to guess an incantation"
            echo "# the day something goes wrong."
            echo "APP_IMAGE=${APP_IMAGE}"
            echo "MIGRATE_IMAGE=${MIGRATE_IMAGE}"
            echo "INSTANCE_NAME=${INSTANCE_NAME}"
          )

          # Every `$` is DOUBLED, because Compose interpolates the contents
          # of env_file too. Measured, not assumed: a value `mot$de{passe}`
          # reaches the container as `mot{passe}` — the `$de` is read as a
          # variable and replaced by nothing. A password silently amputated
          # gives a database that refuses a password which looks right in
          # every file you would think to open.
          content=${content//\$/\$\$}

          printf 'ENV_B64=%s\n' "$(printf '%s\n' "$content" | base64 -w0)" >> "$GITHUB_ENV"
          echo "$(printf '%s\n' "$content" | wc -l) variables prepared."

      - name: Copier sur le serveur
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || secrets.DEPLOY_SSH_PORT || '22' }}
          # The compose files AS THEY ARE IN THE REPOSITORY, not a rendered
          # version. They hold no secret by construction — they are tracked
          # in a public repository, and the `secrets` hook checks them.
          source: deploy/docker-compose.yml,deploy/docker-compose-prod-override.yml
          strip_components: 1
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Migrer PUIS basculer
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || secrets.DEPLOY_SSH_PORT || '22' }}
          envs: ENV_B64
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # Born 0600, and never anything else: the file does not exist
            # before this line, on the runner or on the server.
            umask 077
            printf '%s' "$ENV_B64" | base64 -d > .env
            chmod 600 .env

            # No --env-file, no exported variable: the .env just written
            # carries BOTH what the containers read through env_file and what
            # Compose interpolates. So the command below is exactly the one to
            # type on the server to read the logs — nothing to reconstruct at
            # the worst possible moment.
            compose="docker compose \
              -f docker-compose.yml -f docker-compose-prod-override.yml"

            $compose pull
            # The order is the whole guarantee: a failed migration means no
            # switch, and the old image keeps serving.
            $compose run --rm migrate
            $compose up -d --wait
            docker image prune -f

      - name: Check that the site answers
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS https://unmaxdinfo.fr/api/health > /dev/null; then
              echo "The site answers."
              exit 0
            fi
            sleep 10
          done
          echo "::error::The site does not answer after the deployment"
          exit 1
