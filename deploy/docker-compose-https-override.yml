# HTTPS local. Inclus par ./setup quand URL_SCHEME=https.
#
# Un fichier à part plutôt qu'un label conditionnel : les labels sont une
# liste, et « poser cette entrée seulement si… » ne s'exprime pas dans
# Compose. Le motif est déjà celui des autres overrides.

services:
  app:
    labels:
      # Sans ce label, Traefik sert bien le routeur sur l'entrée websecure
      # mais NE TERMINE PAS le TLS : la requête n'aboutit pas et le
      # diagnostic est trompeur, puisque le certificat est pourtant présenté
      # correctement.
      - traefik.http.routers.app-${INSTANCE_NAME}.tls=true
      - traefik.http.routers.app-${INSTANCE_NAME}.entrypoints=websecure
