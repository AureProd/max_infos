# Local HTTPS. Included by ./setup when URL_SCHEME=https.
#
# A separate file rather than a conditional label: labels are a list, and
# « set this entry only if… » cannot be expressed in Compose. The pattern is
# already that of the other overrides.

services:
  app:
    labels:
      # Without this label, Traefik does serve the router on the websecure
      # entrypoint but DOES NOT TERMINATE TLS: the request fails and the
      # diagnosis is misleading, since the certificate is presented
      # correctly all the same.
      - traefik.http.routers.app-${INSTANCE_NAME}.tls=true
      - traefik.http.routers.app-${INSTANCE_NAME}.entrypoints=websecure
