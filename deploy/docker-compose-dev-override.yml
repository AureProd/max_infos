# Développement : build local, source monté, rechargement à chaud.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: unmaxdinfo:${INSTANCE_NAME}
    # On monte les RÉPERTOIRES de source, jamais la racine : un montage de
    # « . » sur /app masquerait le node_modules construit dans l'image, dont
    # les binaires natifs sont compilés pour l'architecture du conteneur.
    # Ajouter un répertoire de premier niveau = modifier ce fichier.
    volumes:
      - ./app:/app/app
      - ./server:/app/server
      - ./shared:/app/shared
      - ./public:/app/public
      - ./scripts:/app/scripts
      - ./drizzle:/app/drizzle
      - ./nuxt.config.ts:/app/nuxt.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Le cache Nuxt survit à un `up --force-recreate` : le premier rendu
      # est bien plus rapide.
      - nuxt_cache:/app/.nuxt
    environment:
      # Lus par nuxt.config.ts pour calculer hmr.clientPort et allowedHosts.
      URL_PORT: ${URL_PORT:-8080}
      URL_HOST: ${URL_HOST}
    labels:
      # --- Routeur dédié au WebSocket de rechargement à chaud -------------
      # Nuxt lance Vite en middlewareMode : Vite ouvre alors SON PROPRE
      # serveur WebSocket, sur 24678, distinct du 3000. Sans ce routeur, le
      # navigateur demande ws://${URL_HOST}:${URL_PORT}/_nuxt_hmr, Traefik
      # l'envoie sur 3000, Nitro répond 404, et le rechargement à chaud ne
      # se connecte jamais.
      #
      # Le chemin est inventé : dans cette branche, le serveur WebSocket de
      # Vite accepte l'upgrade quel que soit le chemin. Il ne sert donc qu'à
      # donner une prise à Traefik.
      - traefik.http.routers.hmr-${INSTANCE_NAME}.rule=Host(`${URL_HOST}`) && PathPrefix(`/_nuxt_hmr`)
      - traefik.http.routers.hmr-${INSTANCE_NAME}.priority=100
      - traefik.http.routers.hmr-${INSTANCE_NAME}.service=hmr-${INSTANCE_NAME}
      - traefik.http.services.hmr-${INSTANCE_NAME}.loadbalancer.server.port=24678
      # AUCUN middleware ici : rien ne doit toucher à la négociation
      # d'upgrade ni aux en-têtes Host et Origin, que Vite vérifie.
    healthcheck:
      # `nuxt dev` compile à la volée : le premier rendu peut dépasser 60 s.
      start_period: 180s
      interval: 10s
      start_interval: 3s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: unmaxdinfo-migrate:${INSTANCE_NAME}

volumes:
  nuxt_cache:
