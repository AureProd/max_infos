# Development: local build, source mounted, hot reload.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: unmaxdinfo:${INSTANCE_NAME}
    # We mount the source DIRECTORIES, never the root: mounting « . » on
    # /app would mask the node_modules built into the image, whose native
    # binaries are compiled for the container's architecture. Adding a
    # top-level directory means editing this file.
    volumes:
      - ./app:/app/app
      - ./server:/app/server
      - ./shared:/app/shared
      - ./public:/app/public
      - ./scripts:/app/scripts
      - ./drizzle:/app/drizzle
      - ./nuxt.config.ts:/app/nuxt.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # The Nuxt cache survives an `up --force-recreate`: the first render
      # is far faster.
      - nuxt_cache:/app/.nuxt
    environment:
      # Read by nuxt.config.ts to compute ws.clientPort and allowedHosts.
      URL_PORT: ${URL_PORT:-8000}
      URL_HOST: ${URL_HOST}

    # --- Watching the sources ---------------------------------------------
    #
    # The mounts above are enough for hot reload, but they do NOT see the
    # case that really wastes time: a dependency added. node_modules lives
    # in the image; after a `pnpm add`, the image keeps the old one and the
    # application fails on a module not found, with a message that does not
    # say why. It happened three times during this work.
    #
    # `docker compose watch` (or `up --watch`) rebuilds the image as soon as
    # package.json or the lockfile change.
    #
    # NO `sync` rule: the mounts above already handle that, and Compose
    # refuses to watch a path a mount covers — it says so with a warning.
    # Watching therefore only serves the case the mounts cannot see:
    # dependencies.
    develop:
      watch:
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
        - action: rebuild
          path: pnpm-workspace.yaml
    healthcheck:
      # `nuxt dev` compiles on the fly: the first render can exceed 60 s.
      start_period: 180s
      interval: 10s
      start_interval: 3s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: unmaxdinfo-migrate:${INSTANCE_NAME}
    # Migrations and schema are mounted, not frozen into the image: without
    # that, the image would have to be rebuilt on EVERY `pnpm db:generate`,
    # and a stale set of migrations would be applied without anyone
    # noticing — the command answering « migrations applied successfully »
    # since it did apply everything it knows about.
    #
    # In production the image stays self-contained: that is precisely what
    # we want to deploy, a frozen, verifiable artefact.
    volumes:
      - ./drizzle:/app/drizzle:ro
      - ./server/database:/app/server/database:ro
      - ./drizzle.config.ts:/app/drizzle.config.ts:ro

  # A throwaway database reserved for the tests, published on the loopback
  # so `pnpm test` runs from the host. The development one publishes NO
  # port: we do not relax that rule for the tests.
  #
  # tmpfs and not a volume: the data does not survive the container, which
  # is exactly what we want, and the writes never touch the disk.
  db-test:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unmaxdinfo_test
      POSTGRES_USER: unmaxdinfo
      # An ephemeral, in-memory database bound to 127.0.0.1: nothing to protect.
      POSTGRES_PASSWORD: test
      # No durability: a test database losing everything on restart is
      # harmless, and it is two to three times faster.
      POSTGRES_INITDB_ARGS: "--nosync"
    command: >-
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - 127.0.0.1:${DB_TEST_PORT:-15000}:5432
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unmaxdinfo -d unmaxdinfo_test"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nuxt_cache:
