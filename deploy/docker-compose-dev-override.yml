# Développement : build local, source monté, rechargement à chaud.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: unmaxdinfo:${INSTANCE_NAME}
    # On monte les RÉPERTOIRES de source, jamais la racine : un montage de
    # « . » sur /app masquerait le node_modules construit dans l'image, dont
    # les binaires natifs sont compilés pour l'architecture du conteneur.
    # Ajouter un répertoire de premier niveau = modifier ce fichier.
    volumes:
      - ./app:/app/app
      - ./server:/app/server
      - ./shared:/app/shared
      - ./public:/app/public
      - ./scripts:/app/scripts
      - ./drizzle:/app/drizzle
      - ./nuxt.config.ts:/app/nuxt.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Le cache Nuxt survit à un `up --force-recreate` : le premier rendu
      # est bien plus rapide.
      - nuxt_cache:/app/.nuxt
    environment:
      # Lus par nuxt.config.ts pour calculer ws.clientPort et allowedHosts.
      URL_PORT: ${URL_PORT:-8000}
      URL_HOST: ${URL_HOST}

    # --- Surveillance des sources -----------------------------------------
    #
    # Les montages ci-dessus suffisent au rechargement à chaud, mais ils ne
    # voient PAS le cas qui fait vraiment perdre du temps : une dépendance
    # ajoutée. Le node_modules vit dans l'image ; après un `pnpm add`,
    # l'image garde l'ancien et l'application échoue sur un module
    # introuvable, sans que le message dise pourquoi. C'est arrivé trois
    # fois pendant ce chantier.
    #
    # `docker compose watch` (ou `up --watch`) reconstruit l'image dès que
    # package.json ou le lockfile changent.
    #
    # AUCUNE règle `sync` : les montages ci-dessus s'en chargent déjà, et
    # Compose refuse de surveiller un chemin qu'un montage couvre — il le
    # signale d'ailleurs par un avertissement. La surveillance ne sert donc
    # qu'au cas que les montages ne voient pas : les dépendances.
    develop:
      watch:
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
        - action: rebuild
          path: pnpm-workspace.yaml
    healthcheck:
      # `nuxt dev` compile à la volée : le premier rendu peut dépasser 60 s.
      start_period: 180s
      interval: 10s
      start_interval: 3s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: unmaxdinfo-migrate:${INSTANCE_NAME}
    # Les migrations et le schéma sont montés, et non figés dans l'image :
    # sans cela, il faudrait reconstruire l'image à CHAQUE `pnpm db:generate`,
    # et on appliquerait sans s'en apercevoir un jeu de migrations périmé —
    # la commande répondant « migrations applied successfully » puisqu'elle
    # aurait bien appliqué tout ce qu'elle connaît.
    #
    # En production l'image reste autonome : c'est justement ce qu'on veut
    # déployer, un artefact figé et vérifiable.
    volumes:
      - ./drizzle:/app/drizzle:ro
      - ./server/database:/app/server/database:ro
      - ./drizzle.config.ts:/app/drizzle.config.ts:ro

  # Base jetable réservée aux tests, publiée sur la boucle locale pour que
  # `pnpm test` tourne depuis l'hôte. Celle de développement, elle, ne
  # publie AUCUN port : on ne relâche pas cette règle pour les tests.
  #
  # tmpfs et non volume : les données ne survivent pas au conteneur, c'est
  # exactement ce qu'on veut, et les écritures ne touchent pas le disque.
  db-test:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unmaxdinfo_test
      POSTGRES_USER: unmaxdinfo
      # Base éphémère, en mémoire, liée à 127.0.0.1 : rien à protéger.
      POSTGRES_PASSWORD: test # pragma: allowlist secret
      # Sans durabilité : une base de test qui perd tout au redémarrage est
      # sans conséquence, et c'est deux à trois fois plus rapide.
      POSTGRES_INITDB_ARGS: "--nosync"
    command: >-
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - 127.0.0.1:${DB_TEST_PORT:-15000}:5432
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unmaxdinfo -d unmaxdinfo_test"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nuxt_cache:
