# A throwaway development Traefik. Never deployed to production.
# Shared by the « dev » and « preview » environments.

services:
  app:
    depends_on:
      rp:
        condition: service_started
    restart: unless-stopped

  db:
    restart: unless-stopped

  rp:
    # A pinned version, not plain `traefik`: a major upgrade must not arrive
    # by surprise on a Monday morning.
    image: traefik:v3.5
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    volumes:
      # Read only: Traefik only needs to enumerate the containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/config/traefik-dev.yml:/traefik.yml:ro
      # Dynamic configuration: re-read live, unlike the static one. Empty
      # over HTTP, it carries the certificates over HTTPS.
      - ./deploy/dynamic:/dynamic:ro
      - ./deploy/certs:/certs:ro
    ports:
      # 127.0.0.1 and never 0.0.0.0: the development stack is not exposed to
      # the local network.
      # Over HTTPS, the public port points at the TLS entrypoint. ./setup
      # sets PORT_INTERNE from URL_SCHEME, so the announced address and the
      # published port cannot drift apart.
      - 127.0.0.1:${URL_PORT:-8000}:${PORT_INTERNE:-80}
      # Computed by ./setup: URL_PORT + 10000. A fixed offset, rather than a
      # « 1 » glued in front of URL_PORT, which stops being a port beyond
      # four digits.
      - 127.0.0.1:${DASHBOARD_PORT:-18000}:8080
    networks: [reverse_proxy]

networks:
  # No `name:`, deliberately. A fixed name would make ONE global network
  # every clone of the repository would join, and each Traefik would then
  # pick up the others' containers through the Docker socket — all carrying
  # the same Host(...) rule. Left to Compose, the network takes the project
  # name: ${INSTANCE_NAME}_reverse_proxy.
  reverse_proxy:
    external: false
