# The common base for every environment, shaped for production. The
# deploy/docker-compose-*-override.yml files derive from it, and ./setup
# composes the root docker-compose.yml artefact from them (gitignored).

services:
  app:
    image: ${APP_IMAGE}
    restart: always
    # env_file and not environment: a secret placed under environment:
    # would be resolved by `docker compose config` and would end up IN THE
    # CLEAR in the generated artefact. Beware: `docker compose config`
    # unfolds env_file too — what protects the deployment is that the .env
    # does not exist yet when the compose is rendered.
    #
    # required: false because the RENDERING happens on the CI runner, where
    # the file does not exist — it is written on the server at deploy time.
    # Without this, the deployment step would fail before copying anything.
    # A file missing in production is still caught by the configuration
    # validation, which refuses to start without its secrets.
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      # Both names, one router. www had NO router at all until 16/09/2026: it
      # answered 404 behind the TRAEFIK DEFAULT CERT, because a name absent
      # from every rule is also absent from the certificate request.
      - traefik.http.routers.app-${INSTANCE_NAME}.rule=Host(`${URL_HOST}`) || Host(`www.${URL_HOST}`)
      - traefik.http.routers.app-${INSTANCE_NAME}.priority=1
      # Explicit rather than inferred: Traefik must know which port to send
      # to, without depending on what the image exposes.
      - traefik.http.services.app-${INSTANCE_NAME}.loadbalancer.server.port=3000
      # Name the router's service, even when there is only one. As soon as
      # a container declares more than one Traefik service, a router that
      # does not name its own is discarded WITHOUT an error message: the
      # site then answers 404 through the proxy while answering 200 directly
      # on the container. An hour of searching, worth writing down once and
      # for all.
      - traefik.http.routers.app-${INSTANCE_NAME}.service=app-${INSTANCE_NAME}
      # Strips the headers that identify the stack. An EMPTY value in
      # customResponseHeaders removes the header from the response: it is
      # the only place where Server and X-Powered-By really disappear.
      - traefik.http.middlewares.hide-tech-${INSTANCE_NAME}.headers.customResponseHeaders.Server=
      - traefik.http.middlewares.hide-tech-${INSTANCE_NAME}.headers.customResponseHeaders.X-Powered-By=
      # One canonical name. $$ escapes Compose interpolation so that Traefik
      # receives ${1}, its own capture-group syntax.
      - traefik.http.middlewares.www-to-apex-${INSTANCE_NAME}.redirectregex.regex=^https?://www\.(.*)
      - traefik.http.middlewares.www-to-apex-${INSTANCE_NAME}.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.www-to-apex-${INSTANCE_NAME}.redirectregex.permanent=true
      # Six months. No preload while the domain is young: preloading is
      # baked into browsers and cannot be taken back for months.
      - traefik.http.middlewares.hsts-${INSTANCE_NAME}.headers.stsSeconds=15552000
      - traefik.http.middlewares.hsts-${INSTANCE_NAME}.headers.stsIncludeSubdomains=false
      - traefik.http.middlewares.hsts-${INSTANCE_NAME}.headers.stsPreload=false
      # ONE comma-separated value, not one label per middleware. Declaring
      # this key twice keeps only the last: the others vanish without a word.
      # Order matters — redirect www before spending work on the response.
      - traefik.http.routers.app-${INSTANCE_NAME}.middlewares=www-to-apex-${INSTANCE_NAME}@docker,hsts-${INSTANCE_NAME}@docker,hide-tech-${INSTANCE_NAME}@docker
    networks: [default, reverse_proxy]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    # No ports: — the database is only reachable through the project's
    # internal network, never from the host.
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [default]
    healthcheck:
      # CMD-SHELL: the $$ escapes Compose interpolation and lets the
      # container's shell read its own variables.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: ${MIGRATE_IMAGE}
    # Outside the default `up`: the docker/compose#10596 bug makes
    # `up --wait` exit 1 as soon as an init container exits 0. So we invoke
    # it explicitly — which is exactly the sequence expected in production
    # (lot 11):
    #   docker compose run --rm migrate && docker compose up -d --wait
    profiles: ["migrate"]
    restart: "no"
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    depends_on:
      db:
        condition: service_healthy
    networks: [default]

volumes:
  db_data:

networks:
  default:
  # In production: the network of the Traefik already running on the VPS. A
  # literal name, without a project prefix. The local override switches it
  # back to external: false so Compose creates one per instance.
  reverse_proxy:
    external: true
