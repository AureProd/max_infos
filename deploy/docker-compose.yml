# Base commune à tous les environnements, façonnée pour la production.
# Les fichiers deploy/docker-compose-*-override.yml en dérivent, et
# ./setup en compose l'artefact docker-compose.yml de la racine (gitignoré).

services:
  app:
    image: ${APP_IMAGE}
    restart: always
    # env_file et non environment : un secret placé en environment: serait
    # résolu par `docker compose config` et finirait EN CLAIR dans
    # l'artefact généré.
    #
    # required: false parce que le RENDU se fait sur le runner de CI, où le
    # fichier n'existe pas — il vit sur le serveur. Sans cela, l'étape de
    # déploiement échouerait avant même de copier quoi que ce soit. Un
    # fichier manquant en production reste rattrapé par la validation de
    # configuration, qui refuse de démarrer sans ses secrets.
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.app-${INSTANCE_NAME}.rule=Host(`${URL_HOST}`)
      - traefik.http.routers.app-${INSTANCE_NAME}.priority=1
      # Explicite plutôt que déduit : Traefik doit savoir vers quel port
      # envoyer, sans dépendre de ce que l'image expose.
      - traefik.http.services.app-${INSTANCE_NAME}.loadbalancer.server.port=3000
      # Nommer le service du routeur, même quand il n'y en a qu'un. Dès
      # qu'un conteneur déclare plus d'un service Traefik, un routeur qui ne
      # nomme pas le sien est écarté SANS message d'erreur : le site répond
      # alors 404 à travers le proxy tout en répondant 200 en direct sur le
      # conteneur. Une heure de recherche, autant l'écrire une fois pour
      # toutes.
      - traefik.http.routers.app-${INSTANCE_NAME}.service=app-${INSTANCE_NAME}
      # Retire les en-têtes qui identifient la pile. Une valeur VIDE dans
      # customResponseHeaders supprime l'en-tête de la réponse : c'est le
      # seul endroit où Server et X-Powered-By disparaissent vraiment.
      - traefik.http.middlewares.hide-tech-${INSTANCE_NAME}.headers.customResponseHeaders.Server=
      - traefik.http.middlewares.hide-tech-${INSTANCE_NAME}.headers.customResponseHeaders.X-Powered-By=
      - traefik.http.routers.app-${INSTANCE_NAME}.middlewares=hide-tech-${INSTANCE_NAME}@docker
    networks: [default, reverse_proxy]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    # Aucun ports: — la base n'est joignable que par le réseau interne du
    # projet, jamais depuis l'hôte.
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [default]
    healthcheck:
      # CMD-SHELL : le $$ échappe l'interpolation Compose et laisse le shell
      # du conteneur lire ses propres variables.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: ${MIGRATE_IMAGE}
    # Hors du `up` par défaut : le bug docker/compose#10596 fait sortir
    # `up --wait` en 1 dès qu'un conteneur d'init se termine en 0. On
    # l'invoque donc explicitement — ce qui est exactement la séquence
    # attendue en production (lot 11) :
    #   docker compose run --rm migrate && docker compose up -d --wait
    profiles: ["migrate"]
    restart: "no"
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    depends_on:
      db:
        condition: service_healthy
    networks: [default]

volumes:
  db_data:

networks:
  default:
  # En production : le réseau du Traefik déjà en place sur le VPS. Nom
  # littéral, sans préfixe de projet. L'override local le repasse en
  # external: false pour que Compose en crée un par instance.
  reverse_proxy:
    external: true
