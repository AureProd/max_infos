# Preview: the REAL production build, behind the local Traefik, without
# deploying. Selected by ./setup when APP_ENV=preview.
#
# No source mount, no hot reload: this really is the production image we are
# looking at, with its actual server rendering.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: unmaxdinfo:${INSTANCE_NAME}-preview

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: unmaxdinfo-migrate:${INSTANCE_NAME}
