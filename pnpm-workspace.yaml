# pnpm 12 refuses by default to run dependency install scripts: it is a
# protection against malicious packages. We explicitly allow the ones we
# need, and only those.
allowBuilds:
  # esbuild fetches its native binary in its postinstall script. Without it,
  # Vite (and therefore Nuxt) cannot compile. A transitive Vite dependency.
  esbuild: true
  # lefthook puts the Go binary shipped by npm into .bin from its install
  # script. Without it, no Git hook is set.
  lefthook: true

# pnpm 12 also refuses versions published too recently (a quarantine window
# against registry compromises). The accepted exceptions are listed here.
minimumReleaseAgeExclude:
  - zod@4.6.5

# drizzle-kit still drags in the deprecated @esbuild-kit/esm-loader, which
# pins esbuild 0.18.20 -- GHSA-67mh-4wv8-2f99. drizzle-kit itself already
# depends on esbuild ^0.25.4: the override merely aligns the loader on the
# version already installed, rather than keeping a second, vulnerable copy.
overrides:
  esbuild: ^0.25.4
